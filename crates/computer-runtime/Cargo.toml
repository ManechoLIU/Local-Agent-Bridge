[package]
name = "computer-runtime"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
bridge-security-core = { path = "../bridge-security-core" }
local-tool-bridge = { path = "../local-tool-bridge" }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[build-dependencies]
