[package]
name = "process-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }

[dev-dependencies]
bridge-security-core = { path = "../bridge-security-core" }
local-tool-bridge = { path = "../local-tool-bridge" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
